name: CI

on:
  push:
  pull_request:

jobs:
  tests-pc:
    name: Tests unitaires (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test/run.sh

  build-esp32:
    name: Compilation ESP-IDF 5.3
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: airton_ac.bin
          path: build/airton_ac.bin
